function labels(points){let placed=[];return points.map(([x,y],i)=>{let best,score=Infinity;for(const [dx,dy]of [[0,-10],[0,26],[24,8],[-24,8]]){let nx=x+dx,ny=y+dy,w=String(i+1).length*10.5,penalty=0,box={x:nx-w/2-2,y:ny-18,w:w+4,h:22};for(const b of placed)if(box.x<b.x+b.w&&box.x+box.w>b.x&&box.y<b.y+b.h&&box.y+box.h>b.y)penalty+=10000;points.forEach(([px,py],j)=>{if(j!==i&&px>box.x-6&&px<box.x+box.w+6&&py>box.y-6&&py<box.y+box.h+6)penalty+=1000});if(penalty<score){score=penalty;best={x:nx,y:ny,box}}}placed.push(best.box);return best})}

}
$('board').onclick=e=>{if(step>=puzzles[key].points.length)return;let pt=$('board').createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;pt=pt.matrixTransform($('board').getScreenCTM().inverse());let dots=puzzles[key].points,nearest=-1,dist=Infinity;dots.forEach(([x,y],i)=>{let d=Math.hypot(x-pt.x,y-pt.y);if(d<dist){dist=d;nearest=i}});let number=-1,nd=Infinity;labels(dots).forEach((p,i)=>{let d=Math.hypot(p.x-pt.x,p.y-8-pt.y);if(d<nd){nd=d;number=i}});if(nd<=18&&nd<dist){tap(number);return}if(dist<=20)tap(nearest)};
function tap(i){if(i!==step||step>=puzzles[key].points.length)return;step++;hint=false;if(step===puzzles[key].points.length)done++;draw()}
function begin(id){const ids=Object.keys(puzzles),at=ids.indexOf(id);const others=ids.filter(k=>k!==id);for(let i=others.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[others[i],others[j]]=[others[j],others[i]]}queue=[id,...others].slice(0,Number($('rounds').value));opts={show:$('showNext').checked,auto:$('autoHint').checked};done=0;started=Date.now();key=queue[0];step=0;hint=false;$('home').hidden=true;$('end').hidden=true;$('game').hidden=false;draw()}
function home(){$('game').hidden=true;$('end').hidden=true;$('home').hidden=false}
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>begin(b.dataset.id));$('hintButton').onclick=()=>{hint=true;draw()};$('continue').onclick=()=>{if(done===queue.length){$('game').hidden=true;$('end').hidden=false;$('result').textContent=done+'まい できた';return}key=queue[done];step=0;hint=false;draw()};$('teacher').onclick=()=>$('settings').showModal();$('closeSettings').onclick=()=>$('settings').close();$('back').onclick=()=>{if(step>0&&step<puzzles[key].points.length)$('leave').showModal();else home()};$('stay').onclick=()=>$('leave').close();$('leaveYes').onclick=()=>{$('leave').close();home()};$('restart').onclick=home;
</script></body></html>
